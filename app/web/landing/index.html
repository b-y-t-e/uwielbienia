<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161B2E">
  <meta name="color-scheme" content="dark light">
  <title>Uwielbienia</title>
  <link rel="icon" href="../remote/icon.png">
  <link rel="apple-touch-icon" href="../remote/icon.png">
  <!-- Pilot był kiedyś tutaj: kody QR ze starszych wersji aplikacji (#code=…) i tryb „Ekran” (#ekran) prowadzą do telefon/. -->
  <script>if (/(^#|&)(code=|ekran)/.test(location.hash)) location.replace("telefon/" + location.hash);</script>
  <script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
