<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161B2E">
  <meta name="color-scheme" content="dark light">
  <title>Uwielbienia — pilot</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
  <!-- wygląd przed pierwszym rysowaniem: zapamiętany wybór albo ustawienie systemu -->
  <script>document.documentElement.dataset.theme = localStorage.getItem("wyglad") ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");</script>
  <!-- tweetnacl przed modułami: lib/tailcat/nacl.js bierze go z globalThis.nacl -->
  <script src="lib/nacl-fast.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Parowanie: pokazywane, gdy przeglądarka nie zna jeszcze aplikacji -->
  <main id="pairing" class="screen" hidden>
    <img class="brand-icon" src="icon.png" alt="" width="64" height="64">
    <h1 class="brand">Uwielbienia</h1>
    <p class="lead">Na komputerze otwórz „Urządzenia” i zeskanuj kod aparatem.</p>
    <form id="pairForm" class="pair-form">
      <label for="codeInput">Kod parowania</label>
      <input id="codeInput" autocomplete="off" spellcheck="false" placeholder="np. ajk59">
      <button type="submit" class="primary">Połącz</button>
    </form>
    <p id="pairError" class="error" role="alert"></p>
  </main>

  <!-- Pilot: tylko zmiana slajdów. Bieżący slajd z akordami (muzyk widzi wszystko bez dotykania),
       pod nim następny, na dole Wstecz / Dalej. Bez planu i edycji — dziecko nic nie zepsuje. -->
  <main id="remote" class="pilot" hidden>
    <header class="topbar">
      <span id="nowNumber" class="number"></span>
      <span id="nowTitle" class="now-title">Ekran jest pusty</span>
      <span id="status" class="status" data-state="connecting" role="status">Łączenie…</span>
      <!-- tylko z uprawnieniem z okna „Urządzenia” w aplikacji: pieśń jako następna w planie -->
      <button id="addSong" class="icon-button add-song" aria-label="Dodaj pieśń jako następną" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button id="chordsToggle" class="toggle" aria-pressed="true">Akordy</button>
      <button id="themeToggle" class="icon-button" aria-label="Jasny wygląd">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
      </button>
      <button id="toDisplay" class="quiet">Ekran</button>
    </header>

    <section class="current" aria-live="polite">
      <div class="current-head">
        <span id="nowLabel" class="now-label"></span>
        <span id="blankBadge" class="badge" hidden>Ekran wygaszony</span>
      </div>
      <div id="currentLines" class="lines"></div>
      <!-- Film na ekranie: czas, postęp i sterowanie zamiast tekstu -->
      <div id="videoPanel" class="video-panel" hidden>
        <div class="video-clock"><span id="videoTime" class="video-time">0:00</span><span id="videoDuration" class="video-duration"></span></div>
        <div class="video-progress"><div id="videoProgress"></div></div>
        <div class="video-buttons">
          <button id="videoBack" class="video-skip">−15 s</button>
          <button id="videoToggle" class="video-toggle" aria-label="Pauza">
            <svg id="iconPause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3,2 L5.6,2 L5.6,14 L3,14 Z M10.4,2 L13,2 L13,14 L10.4,14 Z" /></svg>
            <svg id="iconPlay" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4.5,2 L14,8 L4.5,14 Z" /></svg>
          </button>
          <button id="videoForward" class="video-skip">+15 s</button>
        </div>
        <!-- obraz względem dźwięku (rzutnik spóźnia obraz) — przesuwamy obraz, nie dźwięk; rzadkie ustawienie, więc małe -->
        <div id="videoOffset" class="video-offset">
          <span>Obraz</span>
          <button id="pictureEarlier" aria-label="Obraz wcześniej o 0,1 s"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10,3 L5,8 L10,13" /></svg></button>
          <b id="pictureOffset">0,0 s</b>
          <button id="pictureLater" aria-label="Obraz później o 0,1 s"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6,3 L11,8 L6,13" /></svg></button>
        </div>
        <p id="videoError" class="video-error" hidden></p>
      </div>
      <!-- Kiosk na ekranie: bieżący element (zmienia się sam) — podgląd obrazu i napis -->
      <div id="kioskPanel" class="kiosk-panel" hidden>
        <img id="kioskImage" alt="">
        <div class="kiosk-caption"><div id="kioskTitle" class="kiosk-title"></div><p id="kioskText"></p></div>
      </div>
    </section>

    <section class="upcoming">
      <div id="nextLabel" class="next-label"></div>
      <div id="nextLines" class="lines"></div>
    </section>

    <footer class="controls">
      <button id="prev" class="big">Wstecz</button>
      <button id="next" class="big primary">Dalej</button>
    </footer>

    <!-- Dodaj pieśń: wyszukiwarka na cały ekran; dotknięcie wyniku = pieśń zaraz za tą na ekranie -->
    <section id="addSheet" class="sheet" role="dialog" aria-label="Dodaj pieśń jako następną" hidden>
      <form id="addForm" class="sheet-search" role="search">
        <input id="addQuery" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
               placeholder="Numer albo słowa pieśni">
        <button id="addCancel" type="button" class="quiet">Anuluj</button>
      </form>
      <ul id="addResults" class="results"></ul>
      <p id="addEmpty" class="sheet-empty" hidden>Nic nie znaleziono.</p>
    </section>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toastText"></span>
      <button id="toastUndo" class="quiet" hidden>Cofnij</button>
    </div>
  </main>

  <!-- Ekran: przeglądarka jako drugi ekran (np. drugi komputer podłączony do rzutnika) -->
  <main id="display" class="display" hidden>
    <div id="displayScreen" class="slide-screen">
      <div class="slide-fit"><div class="slide-text"></div></div>
    </div>
    <button id="leaveDisplay" class="display-exit">Wróć do pilota</button>
  </main>
</body>
</html>
