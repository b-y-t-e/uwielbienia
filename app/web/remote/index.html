<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161B2E">
  <meta name="color-scheme" content="dark light">
  <title>Uwielbienia — pilot</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
  <!-- tweetnacl przed modułami: lib/tailcat/nacl.js bierze go z globalThis.nacl -->
  <script src="lib/nacl-fast.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Parowanie: pokazywane, gdy przeglądarka nie zna jeszcze aplikacji -->
  <main id="pairing" class="screen" hidden>
    <img class="brand-icon" src="icon.png" alt="" width="64" height="64">
    <h1 class="brand">Uwielbienia</h1>
    <p class="lead">Na komputerze otwórz „Telefon” i zeskanuj kod aparatem.</p>
    <form id="pairForm" class="pair-form">
      <label for="codeInput">Albo wklej kod parowania</label>
      <input id="codeInput" autocomplete="off" spellcheck="false" placeholder="kod z okna „Telefon”">
      <button type="submit" class="primary">Połącz</button>
    </form>
    <p id="pairError" class="error" role="alert"></p>
  </main>

  <!-- Pilot: tylko zmiana slajdów. Bieżący slajd z akordami (muzyk widzi wszystko bez dotykania),
       pod nim następny, na dole Wstecz / Dalej. Bez planu i edycji — dziecko nic nie zepsuje. -->
  <main id="remote" class="pilot" hidden>
    <header class="topbar">
      <span id="nowNumber" class="number"></span>
      <span id="nowTitle" class="now-title">Ekran jest pusty</span>
      <span id="status" class="status" data-state="connecting" role="status">Łączenie…</span>
      <button id="chordsToggle" class="toggle" aria-pressed="true">Akordy</button>
      <button id="toDisplay" class="quiet">Ekran</button>
    </header>

    <section class="current" aria-live="polite">
      <div class="current-head">
        <span id="nowLabel" class="now-label"></span>
        <span id="blankBadge" class="badge" hidden>Ekran wygaszony</span>
      </div>
      <div id="currentLines" class="lines"></div>
    </section>

    <section class="upcoming">
      <div id="nextLabel" class="next-label"></div>
      <div id="nextLines" class="lines"></div>
    </section>

    <footer class="controls">
      <button id="prev" class="big">Wstecz</button>
      <button id="next" class="big primary">Dalej</button>
    </footer>
  </main>

  <!-- Ekran: przeglądarka jako drugi ekran (np. drugi komputer podłączony do rzutnika) -->
  <main id="display" class="display" hidden>
    <div id="displayScreen" class="slide-screen">
      <div class="slide-fit"><div class="slide-text"></div></div>
    </div>
    <button id="leaveDisplay" class="display-exit">Wróć do pilota</button>
  </main>
</body>
</html>
